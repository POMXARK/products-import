# Единая точка входа: SPA Angular, API Slim (через FastCGI к php-fpm) и скачанные изображения товаров.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Лимит чуть выше IMPORT_MAX_FILE_BYTES: точную проверку размера делает бэкенд и отвечает 422.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: все запросы /api/* обрабатывает фронт-контроллер Slim.
    location /api/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Публичны только скачанные изображения; загруженные xlsx (storage/uploads) наружу не отдаются.
    # ^~: префикс важнее regex-локейшна статики ниже, иначе .jpg искались бы в корне SPA.
    location ^~ /storage/images/ {
        alias /srv/storage/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /storage/ {
        return 404;
    }

    # Бандлы с хешем в имени кешируются навсегда.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: глубокие ссылки (/products/42) открывают index.html, роутинг делает Angular.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
